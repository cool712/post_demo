<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>Pose Pro Skeleton Recorder</title>
        <link rel="stylesheet" href="css/style.css">
	</head>

	<body>
		<script>
			window.onerror = function(msg, url, line, col, error) {
				alert("Global Error: " + msg + "\nLine: " + line + "\nCol: " + col);
			};
		</script>

        <div id="dynamic-island-prompt">
            <span id="dynamic-island-text">请保持静止</span>
        </div>
		<div id="status-toast">请站在检测框内</div>
        
        <!-- Unstable Dialog -->
        <div id="dialog-unstable" class="custom-dialog" style="display: none;">
            <div class="dialog-content">
                <p>检测到您似乎无法保持绝对静止</p>
                <div class="dialog-buttons">
                    <button id="btn-ignore-unstable">忽略提示</button>
                </div>
            </div>
        </div>

        <!-- Confirm Ready Dialog -->
        <div id="dialog-confirm-ready" class="custom-dialog" style="display: none;">
            <div class="dialog-content">
                <p>确定您是否已确定参与者已经准备就绪，并已经位于准备姿势，并准备开始？</p>
                <div class="dialog-buttons">
                    <button id="btn-confirm-ready">确认</button>
                </div>
            </div>
        </div>

		<video id="video" autoplay playsinline muted></video>
		<canvas id="canvas"></canvas>

		<script type="module" src="js/main.js"></script>
	</body>
</html>
