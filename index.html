<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>Pose Pro Skeleton Recorder</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background: #000;
				overflow: hidden;
			}

			video,
			canvas {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			#tip {
				position: absolute;
				top: 24px;
				left: 12px;
				z-index: 10;
				color: #4ec9b0;
				background: rgba(0, 0, 0, 0.7);
				padding: 6px 10px;
				border-radius: 4px;
				font-family: monospace;
				font-size: 11px;
			}
		</style>
	</head>

	<body>
		<div id="tip">Initializing...</div>
		<video id="video" autoplay playsinline muted></video>
		<canvas id="canvas"></canvas>

		<script type="module">
			// import { PoseLandmarker, FilesetResolver } from "/mediapipe/tasks-vision/vision_bundle.js";
			// import {
			// 	PoseLandmarker,
			// 	FilesetResolver
			// } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";
			  import {
			  	PoseLandmarker,
			  	FilesetResolver
			  } from "/mediapipe/tasks-vision/tasks-vision@latest.js";
			/* ---------- DOM ---------- */
			const video = document.getElementById("video");
			const canvas = document.getElementById("canvas");
			const ctx = canvas.getContext("2d", {
				alpha: true
			});
			const tip = document.getElementById("tip");
			/* ---------- 状态 ---------- */
			let poseLandmarker = null;
			let running = false;
			let facingMode = "user";
			let isRecording = false;
			let currentRecordFrameIndex = 0;
			let poseDataJson = {};

			let dynamicScale = 0.5; // 初始识别分辨率比例 (0.1 ~ 1.0)
			let frameCount = 0;
			let lastFpsCheck = 0;

			// 自动录制状态机
			let autoRecordState = 'DISABLED'; // 'DISABLED' | 'IDLE' | 'COUNTDOWN' | 'RECORDING'
			let countdownStartTime = 0;
			const COUNTDOWN_DURATION = 3000; // 3秒倒计时

			/* ================= 1. 摄像头初始化 ================= */
			async function startCamera() {
				if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
				
				// Handle mirroring for video element
				video.style.transform = facingMode === "user" ? "scaleX(-1)" : "none";

				try {
					const stream = await navigator.mediaDevices.getUserMedia({
						video: {
							facingMode,
							width: {
								ideal: 1280
							},
							height: {
								ideal: 720
							}
						}
					});
					video.srcObject = stream;
					return new Promise(resolve => {
						video.onloadedmetadata = () => {
							video.play();
							canvas.width = video.videoWidth;
							canvas.height = video.videoHeight;
							running = true;
							resolve();
						};
					});
				} catch (err) {
					tip.textContent = "Camera Error: " + err.message;
				}
			}

			/* ================= 2. AI 初始化 ================= */
			async function initAI() {
				try {
					tip.textContent = "AI loading...";

					const vision = await FilesetResolver.forVisionTasks("/mediapipe/tasks-vision/wasm");
					poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
						baseOptions: {
							modelAssetPath: "/mediapipe/model/pose_landmarker_full.task",
							delegate: "GPU"
						},
						runningMode: "VIDEO",
						numPoses: 1
					});
					tip.textContent = "AI Ready";
				} catch (err) {
					tip.textContent = "AI Load Failed";
				}
			}

			/* ================= 3. 主循环 ================= */
			function loop(ts) {
				requestAnimationFrame(loop);

				// 只要摄像头跑起来了 (running === true)，就开始画画
				if (!running) return;

				// 自动调整画布尺寸以适应视频流变化（如旋转）
				if (video.videoWidth > 0 && video.videoHeight > 0) {
					if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
						canvas.width = video.videoWidth;
						canvas.height = video.videoHeight;
					}
				}

				// Draw video frame to canvas so it can be recorded
				ctx.save();
				if (facingMode === "user") {
					ctx.translate(canvas.width, 0);
					ctx.scale(-1, 1);
				}
				ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
				ctx.restore();

				// --- 第二部分：如果 AI 模型还没加载完，到此为止，不跑后面的检测逻辑 ---
				if (!poseLandmarker) {
					// 可以在屏幕上提示用户正在加载 AI
					tip.textContent = "Camera Ready | AI Loading...";
					return;
				}

				// --- 第三部分：AI 检测与骨架绘制 (只有 AI 好了才会跑这里) ---
				frameCount++;
				if (ts - lastFpsCheck > 1000) {
					const fps = frameCount;
					if (fps < 12 && dynamicScale > 0.3) dynamicScale -= 0.1;
					else if (fps > 14 && dynamicScale < 1.0) dynamicScale += 0.1;
					tip.textContent =
						`Quality: ${Math.round(dynamicScale * 100)}% | FPS: ${fps} | Rec: ${isRecording ? 'ON' : 'OFF'}`;
					frameCount = 0;
					lastFpsCheck = ts;
				}

				try {
					if (video.readyState >= 2) {
						const result = poseLandmarker.detectForVideo(video, ts);
						if (result.landmarks && result.landmarks.length > 0) {
							processAndDraw(result.landmarks[0]);
						}
					}
				} catch (e) {
					console.warn("Detection skipped:", e);
				}
			}
			/* ================= 4. 处理数据与绘制 ================= */
			function processAndDraw(lm) {
				// --- 自动开始录制逻辑 ---
				// 只有当状态机处于 IDLE (等待姿势) 或 COUNTDOWN (倒计时) 时才进行判断
				if (!isRecording && (autoRecordState === 'IDLE' || autoRecordState === 'COUNTDOWN')) {
					// 计算双腿角度 (左: 23-25-27, 右: 24-26-28)
					// calcAngle 返回 0~180。直立时接近 180
					const leftLegAngle = calcAngle(lm[23], lm[25], lm[27]);
					const rightLegAngle = calcAngle(lm[24], lm[26], lm[28]);

					// 判断是否都在 170 度以上 (180 +/- 10)
					const isReady = leftLegAngle > 170 && rightLegAngle > 170;

                    // 调试信息：显示当前角度状态
                    ctx.save();
                    ctx.font = "bold 16px monospace";
                    ctx.fillStyle = isReady ? "#00ff00" : "#ff0000";
                    ctx.textAlign = "right";
                    ctx.fillText(`L:${Math.round(leftLegAngle)}° R:${Math.round(rightLegAngle)}°`, canvas.width - 10, 30);
                    ctx.fillText(isReady ? "READY" : "STAND STRAIGHT", canvas.width - 10, 50);
                    ctx.restore();

					if (isReady) {
						if (autoRecordState === 'IDLE') {
							autoRecordState = 'COUNTDOWN';
							countdownStartTime = Date.now();
						} else if (autoRecordState === 'COUNTDOWN') {
							const elapsed = Date.now() - countdownStartTime;
							const remaining = Math.ceil((COUNTDOWN_DURATION - elapsed) / 1000);

							// 屏幕变绿 (半透明覆盖)
							ctx.save();
							ctx.fillStyle = "rgba(0, 255, 0, 0.4)"; // 增加不透明度
							ctx.fillRect(0, 0, canvas.width, canvas.height);

							// 显示倒计时数字
							ctx.translate(canvas.width / 2, canvas.height / 2);
							
							// 自动检测并旋转文字方向（基于屏幕旋转角度）
							// window.orientation: 0(竖屏), 90(左横屏), -90(右横屏)
							// 注意：部分新浏览器使用 screen.orientation.angle
							let rotation = 0;
							if (screen.orientation && screen.orientation.angle) {
								rotation = screen.orientation.angle;
							} else if (window.orientation) {
								rotation = window.orientation;
							}

							// 如果 canvas 本身没有随屏幕旋转（即 videoWidth/Height 已经对调了），
							// 通常不需要额外旋转。但如果 canvas 是被强制缩放或者容器旋转了，可能需要反向补偿。
							// 这里我们尝试最稳妥的方式：根据长宽比判断当前是不是“看起来像横屏但文字竖着”
							
							// 方案：如果处于横屏模式（90或-90度），通常希望文字是横向阅读的。
							// 大多数现代移动浏览器旋转屏幕时会自动旋转页面内容，不需要手动 ctx.rotate。
							// 如果您遇到文字没转的情况，通常是因为 WebView 锁定了方向，但 Video 流转了。
							
							// 尝试强制修正：如果屏幕是横屏的，我们确保文字绘制方向垂直于长边
							// 但实际上最简单有效的方法通常是：不要手动 translate/rotate，让浏览器自己处理。
							// 之前的 translate(center) + fillText(0,0) 是标准的居中写法。
							
							// 如果之前的方法不行，说明 context 的坐标系没有变。
							// 让我们尝试根据 rotation 手动旋转 context。
							if (rotation === 90) {
								ctx.rotate(-Math.PI / 2);
							} else if (rotation === -90 || rotation === 270) {
								ctx.rotate(Math.PI / 2);
							} else if (rotation === 180) {
								ctx.rotate(Math.PI);
							}

							ctx.fillStyle = "white";
							ctx.strokeStyle = "black";
							ctx.lineWidth = 4;
							ctx.font = "bold 150px monospace";
							ctx.textAlign = "center";
							ctx.textBaseline = "middle";
							ctx.strokeText(remaining.toString(), 0, 0);
							ctx.fillText(remaining.toString(), 0, 0);
							ctx.restore();

							if (elapsed >= COUNTDOWN_DURATION) {
								// 倒计时结束，真正开始录制
								_startMediaRecorder();
							}
						}
					} else {
						// 姿势不满足，重置倒计时
						autoRecordState = 'IDLE';
					}
				} 

				console.log("Point 0 data:", lm[0]);
				// A. 记录数据 (严格按照 JSON 格式需求)
				if (isRecording) {
					poseDataJson[`frame_${currentRecordFrameIndex}`] = lm.map(p => [
						Math.round(p.x * 1000) / 1000,
						Math.round(p.y * 1000) / 1000,
						Math.round(p.visibility * 100) / 100
					]);
					currentRecordFrameIndex++;
				}

				// B. 绘制逻辑 (保留角度和骨架)
				ctx.save();
				ctx.strokeStyle = "#00ff7f";
				ctx.fillStyle = "#ffffff";
				ctx.lineWidth = 4;
				ctx.lineCap = "round";
				ctx.lineJoin = "round";

				const bones = [
					[11, 13],
					[13, 15],
					[12, 14],
					[14, 16], // 手臂
					[23, 25],
					[25, 27],
					[24, 26],
					[26, 28], // 腿部
					[11, 12],
					[23, 24],
					[11, 23],
					[12, 24] // 躯干
				];

				bones.forEach(([a, b]) => {
					const pA = toCanvas(lm[a]);
					const pB = toCanvas(lm[b]);
					ctx.beginPath();
					ctx.moveTo(pA.x, pA.y);
					ctx.lineTo(pB.x, pB.y);
					ctx.stroke();
				});

				// 绘制关键点
				lm.forEach(p => {
					const cp = toCanvas(p);
					ctx.beginPath();
					ctx.arc(cp.x, cp.y, 4, 0, Math.PI * 2);
					ctx.fill();
				});

				// 绘制角度
				drawAngle(lm[11], lm[13], lm[15]); // 左肘
				drawAngle(lm[12], lm[14], lm[16]); // 右肘
				drawAngle(lm[23], lm[25], lm[27]); // 左膝
				drawAngle(lm[24], lm[26], lm[28]); // 右膝

				ctx.restore();
			}

			/* ================= 5. 工具函数 ================= */
			function toCanvas(p) {
				let x = (facingMode === "user") ? (1 - p.x) : p.x;
				return {
					x: x * canvas.width,
					y: p.y * canvas.height
				};
			}

			function calcAngle(a, b, c) {
				const ab = {
					x: a.x - b.x,
					y: a.y - b.y
				};
				const cb = {
					x: c.x - b.x,
					y: c.y - b.y
				};
				const dot = ab.x * cb.x + ab.y * cb.y;
				const mag1 = Math.hypot(ab.x, ab.y);
				const mag2 = Math.hypot(cb.x, cb.y);
				// Protect against division by zero
				if (mag1 === 0 || mag2 === 0) return 0;
				// Clamp the value between -1 and 1 to handle floating point errors
				const cosine = Math.max(-1, Math.min(1, dot / (mag1 * mag2)));
				return Math.acos(cosine) * 180 / Math.PI;
			}

			function drawAngle(a, b, c) {
				const angle = Math.round(calcAngle(a, b, c));
				const p = toCanvas(b);
				ctx.font = "bold 14px monospace";
				ctx.fillStyle = "#ff0000";
				ctx.fillText(`${angle}°`, p.x + 8, p.y - 8);
			}

			/* ================= 6. 录制与上传接口 ================= */
			let mediaRecorder;
			let recordedChunks = [];

			// 真正开始录制的内部函数
			function _startMediaRecorder() {
				recordedChunks = [];
				poseDataJson = {};
				currentRecordFrameIndex = 0;

				const stream = canvas.captureStream(25);
				const options = {
					mimeType: 'video/mp4;codecs=avc1'
				};
				// 检查浏览器是否支持 mp4，如果不支持则回退到 webm
				if (!MediaRecorder.isTypeSupported(options.mimeType)) {
					console.warn("MP4 不支持，回退到 WebM");
					options = {
						mimeType: 'video/webm;codecs=vp8'
					};
				}
				mediaRecorder = new MediaRecorder(stream, options);

				mediaRecorder.ondataavailable = e => {
					if (e.data.size > 0) recordedChunks.push(e.data);
				};
				mediaRecorder.start();
				isRecording = true;
				autoRecordState = 'RECORDING';
				console.log("Recording started...");
			}

			// 外部调用的 startRecord，现在只作为“开启检测”的开关
			window.startRecord = function() {
				console.log("进入姿势检测模式...");
				autoRecordState = 'IDLE'; // 进入 IDLE 状态，等待姿势满足
				countdownStartTime = 0;
			};
			
			// 暂停拍摄
			window.pauseRecord = function() {
    if (!mediaRecorder) return;
    if (mediaRecorder.state === "recording") {
        mediaRecorder.pause(); // 暂停硬件录制
    } else if (mediaRecorder.state === "paused") {
        mediaRecorder.resume(); // 恢复硬件录制
    }};
            // 修改上传逻辑，确保可以二次上传
            let lastVideoBlob = null;
            let lastJsonBlob = null;

			window.stopAndUpload = async function(uploadUrl, token, analyzeUrl,logId) {
				// 重置自动录制状态
				autoRecordState = 'DISABLED';

				// 核心：如果已经停止录制了，说明是“重试”行为，直接走上传逻辑
    if (mediaRecorder && mediaRecorder.state === "inactive") {
        if (lastVideoBlob) {
            console.log("检测到已停止录制，正在进行重试上传...");
            return await performUploadAction(uploadUrl, token, analyzeUrl,logId);
        }
    }

    // 第一次正常停止并上传
    isRecording = false;
    mediaRecorder.onstop = async () => {
        // 将数据转为 Blob 永久存入变量，即使网络失败，数据也不会丢
        lastVideoBlob = new Blob(recordedChunks, { type: "video/mp4" });
        lastJsonBlob = new Blob([JSON.stringify(poseDataJson)], { type: "application/json" });
        await performUploadAction(uploadUrl, token, analyzeUrl,logId);
    };
				
				mediaRecorder.stop();
			};
// 抽取独立的上传逻辑
async function performUploadAction(uploadUrl, token, analyzeUrl,logId) {
    const formData = new FormData();
    formData.append("file", lastVideoBlob, "video.mp4");
    // formData.append("pose_data", lastJsonBlob, "data.json");
    // formData.append("duration", flutterDuration);
    try {
		// await fetch("https://webhook.site/d99cfd3f-a811-4fee-bb70-77f5a87c289f", { method: "POST", body: formData, headers: { 'Authorization': `Bearer ${token}` }})
        const response = await fetch(uploadUrl, { method: "POST", body: formData, headers: { 'Authorization': `Bearer ${token}` }});
        const resData = await response.json();
        if (resData.code === 200) {
            const videoUrl = resData.data.url;
            // 2. 调用分析接口 (串联)
            const analyzeRes = await fetch(analyzeUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
					"log_id":logId,
                    "video_url": videoUrl,
                    "data_json": poseDataJson // 传入识别到的骨架 JSON
                })
            });
			// await fetch("https://webhook.site/d99cfd3f-a811-4fee-bb70-77f5a87c289f", {
            //     method: "POST",
            //     headers: {
            //         "Content-Type": "application/json",
            //         "Authorization": `Bearer ${token}`
            //     },
            //     body: JSON.stringify({
            //         "video_url": videoUrl,
            //         "data_json": poseDataJson // 传入识别到的骨架 JSON
            //     })
            // });
            const analyzeData = await analyzeRes.json();
			if (analyzeData.code === 200) {
                // 成功：返回 analyzeData 里的 data 部分
                window.flutter_inappwebview.callHandler("onUploadComplete", {
                    success: true,
                    videoUrl: videoUrl,
                    analyzeData: analyzeData.data // 仅返回 data 节点内容
                });
            } else {
                // 失败：code 不为 200，抛出异常
                throw new Error(analyzeData.msg || "动作分析失败，请稍后重试");
            }
        } else {
            throw new Error(resData.msg || "上传视频失败");
        }
    } catch (err) {
		console.error("详细错误信息:", err);
        // 如果失败，通知 Flutter 允许重试
        window.flutter_inappwebview.callHandler("onUploadComplete", {
            success: false,
            error: err.toString()
        });
    }
}
			window.toggleCamera = async () => {
				running = false;
				facingMode = facingMode === "user" ? "environment" : "user";
				await startCamera();
				return facingMode;
			};

			/* ================= 启动 ================= */
			async function main() {
				await startCamera();
				requestAnimationFrame(loop);
				// Delay AI init slightly to ensure first frame renders
				setTimeout(initAI, 100);
			}
			main();
		</script>
	</body>
</html>
